# --- StreamTrack secrets ---
#
# Every REPLACE_ME below must be changed before this is applied. There are no
# working defaults on purpose: the backend fails fast if ADMIN_PASSWORD is
# unset, and ADMIN_PASSWORD is only used the first time the admin user is
# created — later restarts will not overwrite a password changed in the app.
#
# Generate the two random values with:
#   python3 -c "import secrets; print(secrets.token_hex(32))"   # JWT_SECRET
#   python3 -c "import secrets; print(secrets.token_urlsafe(24))"  # passwords
#
# This file is committed in the clear. That is fine only while the values are
# placeholders. Before putting real credentials in it, encrypt with SOPS + age
# so the repo never carries plaintext secrets.
apiVersion: v1
kind: Secret
metadata:
  name: streamtrack-secrets
  namespace: streamtrack
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_WITH_A_64_CHAR_HEX_STRING"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "REPLACE_ME_ADMIN_PASSWORD"
  MONGO_ROOT_USER: "streamtrack"
  MONGO_ROOT_PASSWORD: "REPLACE_ME_MONGO_PASSWORD"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: streamtrack-config
  namespace: streamtrack
data:
  DB_NAME: "streamtrack_db"
  CORS_ORIGINS: "*"
  # Update this to your public homelab hostname (matches Ingress host)
  FRONTEND_URL: "http://streamtrack.local"
