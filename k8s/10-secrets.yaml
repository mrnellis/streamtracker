# --- StreamTrack secrets ---
# IMPORTANT: change these values before applying to your cluster.
# Generate a strong JWT_SECRET with:
#   python3 -c "import secrets; print(secrets.token_hex(32))"
apiVersion: v1
kind: Secret
metadata:
  name: streamtrack-secrets
  namespace: streamtrack
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_WITH_A_64_CHAR_HEX_STRING"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "admin123"
  MONGO_ROOT_USER: "streamtrack"
  MONGO_ROOT_PASSWORD: "REPLACE_ME_MONGO_PASSWORD"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: streamtrack-config
  namespace: streamtrack
data:
  DB_NAME: "streamtrack_db"
  CORS_ORIGINS: "*"
  # Update this to your public homelab hostname (matches Ingress host)
  FRONTEND_URL: "http://streamtrack.local"
