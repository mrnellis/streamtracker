apiVersion: v1
kind: Service
metadata:
  name: streamtrack-mongo
  namespace: streamtrack
  labels:
    app: streamtrack-mongo
spec:
  clusterIP: None
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
  selector:
    app: streamtrack-mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: streamtrack-mongo
  namespace: streamtrack
spec:
  serviceName: streamtrack-mongo
  replicas: 1
  selector:
    matchLabels:
      app: streamtrack-mongo
  template:
    metadata:
      labels:
        app: streamtrack-mongo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # `mongodb` user baked into the mongo image
        runAsGroup: 999
        fsGroup: 999            # chowns the PVC so mongod can write /data/db
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongo
          image: mongo:7.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: streamtrack-secrets
                  key: MONGO_ROOT_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: streamtrack-secrets
                  key: MONGO_ROOT_PASSWORD
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            # mongod puts its unix socket in /tmp, and the image declares
            # /data/configdb as a VOLUME — Kubernetes ignores VOLUME, so it
            # would land on the read-only rootfs without this.
            - name: tmp
              mountPath: /tmp
            - name: configdb
              mountPath: /data/configdb
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
        - name: configdb
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
