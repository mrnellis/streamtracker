apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamtrack-frontend
  namespace: streamtrack
  labels:
    app: streamtrack-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamtrack-frontend
  template:
    metadata:
      labels:
        app: streamtrack-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # nginx user in nginxinc/nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # Build with:
          #   docker build --build-arg REACT_APP_BACKEND_URL=http://streamtrack.local \
          #     -t <registry>/streamtrack-frontend:latest ./frontend
          image: localhost/streamtrack-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            # nginx needs these writable; the rest of the filesystem does not.
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: streamtrack-frontend
  namespace: streamtrack
spec:
  selector:
    app: streamtrack-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
