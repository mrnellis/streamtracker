apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamtrack-frontend
  namespace: streamtrack
  labels:
    app: streamtrack-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamtrack-frontend
  template:
    metadata:
      labels:
        app: streamtrack-frontend
    spec:
      containers:
        - name: frontend
          # Build with:
          #   docker build --build-arg REACT_APP_BACKEND_URL=http://streamtrack.local \
          #     -t <registry>/streamtrack-frontend:latest ./frontend
          image: streamtrack-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: streamtrack-frontend
  namespace: streamtrack
spec:
  selector:
    app: streamtrack-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
