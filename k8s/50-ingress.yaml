# Ingress: routes /api/* to backend, everything else to the SPA.
# Assumes k3s, which ships Traefik as the default ingress controller.
# On a cluster running nginx-ingress instead, set ingressClassName to `nginx`.
# Change `host:` to whatever DNS name resolves to your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamtrack
  namespace: streamtrack
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: streamtrack.lab.home.arpa
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: streamtrack-backend
                port:
                  number: 8001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: streamtrack-frontend
                port:
                  number: 80
